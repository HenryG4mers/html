<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS Interno</title>
  <!--
    FORMA 2: CSS INTERNO
    O estilo fica reunido na tag <style>, dentro do <head>.
      -->
  
</head>
<style>
    header {
        background-color: #6f4e37;
        text-align: center;
        padding: 10px;
        margin: 10px;
   
    }
    header h1 {
        color: #fffde6;
        margin: 0;
        padding: 10px;
        font-family: "Comic Sans MS", sans-serif;
        text-align: center;         
    }
    header p {
        color: #fffde6;
        margin: 0;
        padding: 5px;
        font-family: "Comic Sans MS", sans-serif;
        text-align: center;         
    }
    body {
        margin: 0;
        padding: 0;
        background-color: #f5f5dc;
    }
    main {
        padding: 20px;
        font-family: "Comic Sans MS", sans-serif;
        width: 400px;
        margin: 0 auto;
    }
    main h2{
        text-align: center;
        font-family: "Comic Sans MS", sans-serif;
        color:#6f4e37
    }
    section {
        background-color: #ffffff;
        border: 1px solid #d4a373;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 10px;
    }
    section h3 {
        margin: 0;
        font-family: Georgia, serif;
        color: #6f4e37;
    }
    section p {
        margin: 5px 0 0 0;
        font-family: Verdana, sans-serif;
        color: #6f4e37;
    }
    footer {
        background-color: #6f4e37;
        color: #fffde6;
        padding: 10px;
        text-align: center;
        font-family: "Segoe UI", sans-serif;
        margin: 10px;
    }
</style>
<body>

  <header>
    <h1>☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>

</body>
</html>
