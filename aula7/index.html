<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <table style="border: 1px solid rgb(0, 0, 0); border-collapse: collapse;">
        <tr>
            <td colspan="3" style="border: 1px solid rgb(0, 0, 0); text-align: center; background-color: #000000; color: white;">Informações pessoais</td>
        </tr>
        <tr style="border-bottom: 1px solid rgb(255, 0, 0);">
            <th style="border: 1px solid rgb(0, 0, 0);">Nome</th>
            <th style="border: 1px solid rgb(0, 0, 0);">Idade</th>
            <th style="border: 1px solid rgb(0, 0, 0);">Profissão</th>
        </tr>
        <tr style="border: 1px solid rgb(0, 0, 0);">
            <td style="border: 1px solid rgb(0, 0, 0);">Henry</td>
            <td style="border: 1px solid rgb(0, 0, 0);">16</td>
            <td style="border: 1px solid rgb(0, 0, 0);">Engenheiro</td>
        </tr>
    </table>
</body>
</html>
